services:
  - type: web
    name: playmetric
    runtime: node
    plan: 0.5c-512mb # Preserve the existing paid 0.5 CPU / 512 MB instance
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
